<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path edges · 5 options</title>
<style>
@font-face { font-family: 'Be Vietnam Pro'; font-weight: 400; src: url(../../../assets/fonts/be-vietnam-pro-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Be Vietnam Pro'; font-weight: 400; src: url(../../../assets/fonts/be-vietnam-pro-400-vietnamese.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: 'Be Vietnam Pro'; font-weight: 700; src: url(../../../assets/fonts/be-vietnam-pro-700-latin.woff2) format('woff2'); }
@font-face { font-family: 'Be Vietnam Pro'; font-weight: 700; src: url(../../../assets/fonts/be-vietnam-pro-700-vietnamese.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
:root { --night: #0B1220; --night-2: #121B2E; --line: #2A3A58; --text: #E6EEF6; --muted: #A9B8C8; --cyan: #5FD8E8; --cyan-ink: #062B31; --gold: #F2C14E; --sans: 'Be Vietnam Pro', system-ui, sans-serif; }
* { box-sizing: border-box; }
html { background: var(--night); color: var(--text); font: 400 16px/1.55 var(--sans); }
body { margin: 0; padding: 32px 16px 80px; }
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font: 700 1.75rem/1.2 var(--sans); margin: 0 0 8px; }
.lede { color: var(--muted); max-width: 70ch; margin: 0 0 24px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.bar button { font: 500 .9375rem/1 var(--sans); color: var(--text); background: var(--night-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: pointer; }
.bar button:hover { border-color: var(--muted); }
.bar button[aria-pressed="true"] { background: var(--cyan); color: var(--cyan-ink); border-color: var(--cyan); font-weight: 700; }
.bar button kbd { font: inherit; opacity: .6; margin-right: 6px; }
.bar.scenes button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #2B2330; }
.view { position: relative; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 2px var(--line); background: #3a3a50; }
.view canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.desc { margin: 16px 0 32px; max-width: 75ch; }
.desc h2 { font: 700 1.25rem/1.3 var(--sans); margin: 0 0 4px; }
.desc p { color: var(--muted); margin: 0; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid figure { margin: 0; cursor: pointer; }
.grid canvas { width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px; box-shadow: 0 0 0 2px var(--line); display: block; }
.grid figure.on canvas { box-shadow: 0 0 0 3px var(--cyan); }
.grid figcaption { font-size: .875rem; color: var(--muted); margin-top: 6px; }
.grid figcaption b { color: var(--text); }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mép đường gạch và cỏ: 5 hướng + bản áp dụng</h1>
  <p class="lede">Bản đồ Văn Miếu thật (sân 1 và sân 4), vẽ lại với từng kiểu mép. Hiện tại gạch cắt thẳng vào cỏ, không có gì ở giữa nên nhìn như dán lên. Bấm nút hoặc phím 0 đến 6 để đổi, và chọn cảnh ở hàng thứ hai.</p>
  <div class="bar" id="opts"></div>
  <div class="bar scenes" id="scenes"></div>
  <div class="view"><canvas id="big"></canvas></div>
  <div class="desc" id="desc"></div>
  <div class="grid" id="grid"></div>
</div>
<script src="../../../assets/game/maps/van-mieu.js"></script>
<script src="../../../assets/js/game/ground-fx.js"></script>
<script>
(function () {
  var ROOT = '../../../';
  var map = window.CC.maps['van-mieu'], T = map.tile;
  var SCENES = [
    { id: 'c1', label: 'Sân 1: lối gạch', x: 6, y: 86, w: 28, h: 14 },
    { id: 'c4', label: 'Sân 4: sân lát đá', x: 6, y: 22, w: 28, h: 16 }
  ];
  var OPTS = [
    { id: 'now', label: 'Hiện tại', title: 'Hiện tại', text: 'Gạch và cỏ chạm thẳng nhau theo đường kẻ ô, không có bóng, không có viền.' },
    { id: 'shade', label: 'Bóng mép', title: '1. Bóng mép (nhẹ nhất)', text: 'Không thêm vật liệu mới, chỉ thêm chiều sâu: một viền tối 1 px của cỏ đè lên mép gạch, và một dải gạch sẫm hơn 2 px như bị cỏ che bóng. Thay đổi ít nhất, hợp với mọi map.' },
    { id: 'kerb', label: 'Bó vỉa đá', title: '2. Bó vỉa đá', text: 'Một hàng đá xám bó quanh lối đi, có mạch nối mỗi 8 px, mặt trên sáng hơn. Cỏ bên ngoài có một dải bóng tối 1 px. Giống sân đình, sân chùa có viền đá ong hoặc đá xanh.' },
    { id: 'soldier', label: 'Gạch xếp dọc', title: '3. Hàng gạch xếp dọc', text: 'Mép lối đi là một hàng gạch đặt dọc (vuông góc với mép), sẫm màu hơn, có mạch vữa. Đây là cách lát gạch Bát Tràng hay gặp ở sân cổ: vẫn cùng một chất liệu nhưng có viền rõ ràng.' },
    { id: 'grass', label: 'Cỏ lấn mép', title: '4. Cỏ lấn mép (tự nhiên)', text: 'Cỏ mọc tràn lên mép gạch thành đường lượn không đều, đầu ngọn cỏ sẫm hơn, gạch ngay dưới cỏ có bóng. Mép không còn thẳng theo ô, nhìn như sân đã cũ và có người chăm.' },
    { id: 'final', label: 'Bản áp dụng', title: '6. Bản áp dụng: 5 + hàng rào mới', text: 'Đây là đúng cái game sẽ vẽ (cùng file assets/js/game/ground-fx.js): mép kiểu 5, và hàng rào cây được vẽ lại: lá sẫm hơn cỏ nên tách khỏi bãi cỏ, mặt trên lượn sóng, hai đầu bo tròn có viền, và có bóng đổ xuống cỏ.' },
    { id: 'mix', label: 'Đá + cỏ', title: '5. Bó vỉa đá + cỏ lấn', text: 'Kết hợp 2 và 4: có viền đá rõ ràng, nhưng cỏ phủ lên viền đá chỗ nhiều chỗ ít, nên vừa gọn vừa không cứng.' }
  ];

  OPTS.push(OPTS.splice(OPTS.findIndex(function (o) { return o.id === 'final'; }), 1)[0]);

  /* ---------- images ---------- */
  var imgs = {};
  function want(src) { if (!imgs[src]) { var im = new Image(); im.src = ROOT + src; imgs[src] = im; } return imgs[src]; }
  var sets = map.tilesets.slice().sort(function (a, b) { return a.firstgid - b.firstgid; });
  sets.forEach(function (ts) {
    if (ts.image) want(ts.image);
    else Object.keys(ts.tiles).forEach(function (k) { want(ts.tiles[k].image); });
  });
  function tileOf(gid) {
    gid &= 0x1fffffff; if (!gid) return null;
    var ts = null; for (var i = 0; i < sets.length; i++) if (gid >= sets[i].firstgid) ts = sets[i];
    if (!ts) return null;
    var n = gid - ts.firstgid;
    if (ts.image) { var c = ts.columns; return { im: imgs[ts.image], sx: (n % c) * T, sy: Math.floor(n / c) * T, w: T, h: T }; }
    var t = ts.tiles[n]; return t ? { im: imgs[t.image], sx: 0, sy: 0, w: t.w, h: t.h, flat: t.flat, prop: true } : null;
  }
  var layer = function (n) { return map.layers.filter(function (l) { return l.name === n; })[0]; };
  var ground = layer('ground'), floor = layer('floor'), walls = layer('walls');
  var objects = layer('objects').objects;
  // what counts as path: van-mieu-tiles courtyard brick (rows 0-1) and hn-tiles paving
  var VM = sets.filter(function (s) { return s.name === 'van-mieu-tiles'; })[0].firstgid;
  var HN = sets.filter(function (s) { return s.name === 'hn-tiles'; })[0].firstgid;
  function isPath(gid) { gid &= 0x1fffffff; return (gid >= VM && gid < VM + 16) || gid === HN + 8 || gid === HN + 9; }

  /* ---------- helpers ---------- */
  function hash(x, y, s) { var h = (x * 374761393 + y * 668265263 + (s || 0) * 2246822519) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
  function vnoise(x, y, sc, s) {   // smooth value noise, 0..1
    var fx = x / sc, fy = y / sc, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
    tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    var a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
    return a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty;
  }
  var OUT = [58, 58, 80], GR_D = [86, 141, 97], GR_S = [101, 168, 92];
  var ST = [178, 170, 158], ST_L = [206, 198, 182], ST_D = [140, 130, 122];
  var BR_D = [146, 74, 50], BR_D2 = [160, 84, 56], MORT = [118, 86, 76];
  function mul(c, k) { return [c[0] * k | 0, c[1] * k | 0, c[2] * k | 0]; }

  /* ---------- render one scene with one option ---------- */
  function render(scene, opt) {
    var W = scene.w * T, H = scene.h * T;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
    function drawLayer(l) {
      for (var ty = 0; ty < scene.h; ty++) for (var tx = 0; tx < scene.w; tx++) {
        var gid = l.data[(scene.y + ty) * map.w + scene.x + tx], t = tileOf(gid);
        if (t && !t.prop) g.drawImage(t.im, t.sx, t.sy, T, T, tx * T, ty * T, T, T);
      }
    }
    if (opt === 'final') {
      g.drawImage(finalGround(), scene.x * T, scene.y * T, W, H, 0, 0, W, H);
      return finishProps(g, scene, W, H);
    }
    drawLayer(ground);
    var grassPx = g.getImageData(0, 0, W, H).data;   // the lawn under everything, for grass that spills over
    drawLayer(floor);

    // pixel mask of path, with the map around the crop so edges at the border are right
    var M = 4, MW = W + 2 * M, MH = H + 2 * M, mask = new Uint8Array(MW * MH);
    for (var py = 0; py < MH; py++) for (var px = 0; px < MW; px++) {
      var tx = scene.x + Math.floor((px - M) / T), ty = scene.y + Math.floor((py - M) / T);
      var ok = tx >= 0 && ty >= 0 && tx < map.w && ty < map.h && isPath(floor.data[ty * map.w + tx]);
      mask[py * MW + px] = ok ? 1 : 0;
    }
    // chebyshev distance (inside path: to nearest grass; outside: to nearest path), capped at 6
    var dIn = new Uint8Array(MW * MH), dOut = new Uint8Array(MW * MH);
    for (var i = 0; i < MW * MH; i++) { dIn[i] = mask[i] ? 6 : 0; dOut[i] = mask[i] ? 0 : 6; }
    for (var pass = 0; pass < 6; pass++) for (var y = 1; y < MH - 1; y++) for (var x = 1; x < MW - 1; x++) {
      var k = y * MW + x, a, b, mi = 99, mo = 99;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { a = dIn[k + dy * MW + dx]; b = dOut[k + dy * MW + dx]; if (a < mi) mi = a; if (b < mo) mo = b; }
      if (mask[k] && dIn[k] > mi + 1) dIn[k] = mi + 1;
      if (!mask[k] && dOut[k] > mo + 1) dOut[k] = mo + 1;
    }
    function grassDir(x, y) { // where the nearest grass lies: 'h' if it is above/below, 'v' if left/right
      var k = (y + M) * MW + x + M;
      for (var r = 1; r <= 4; r++) {
        if (!mask[k - r * MW] || !mask[k + r * MW]) return { axis: 'h', north: !mask[k - r * MW] };
        if (!mask[k - r] || !mask[k + r]) return { axis: 'v', west: !mask[k - r] };
      }
      return { axis: 'c' };
    }

    if (opt !== 'now') {
      var id = g.getImageData(0, 0, W, H), p = id.data;
      var set = function (x, y, c) { var o = (y * W + x) * 4; p[o] = c[0]; p[o + 1] = c[1]; p[o + 2] = c[2]; };
      var get = function (x, y) { var o = (y * W + x) * 4; return [p[o], p[o + 1], p[o + 2]]; };
      var lawn = function (x, y) { var o = (y * W + x) * 4; return [grassPx[o], grassPx[o + 1], grassPx[o + 2]]; };
      var isLawn = function (x, y) { var c = get(x, y); return c[1] > c[0] + 40 && c[1] > 150; };   // bare grass, not tufts or hedges
      for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
        var k = (y + M) * MW + x + M, inP = mask[k], di = dIn[k], dO = dOut[k];
        var wx = scene.x * T + x, wy = scene.y * T + y;   // world pixel, so noise is the same in every crop
        if (opt === 'shade') {
          if (inP && di === 1) set(x, y, GR_D);
          else if (inP && di <= 3) set(x, y, mul(get(x, y), di === 2 ? .8 : .9));
        }
        if (opt === 'kerb' || opt === 'mix') {
          if (inP && di <= 3) {
            var gd = grassDir(x, y), seam = gd.axis === 'h' ? wx % 8 === 0 : gd.axis === 'v' ? wy % 8 === 0 : false;
            var c = di === 1 ? OUT : di === 3 ? ST_D : ST;
            if (di === 2 && ((gd.axis === 'h' && gd.north) || (gd.axis === 'v' && gd.west))) c = ST_L;
            if (di === 2 && hash(wx, wy, 3) < .12) c = mul(ST, .93);
            if (seam && di > 1) c = ST_D;
            set(x, y, c);
          } else if (!inP && dO === 1 && isLawn(x, y)) set(x, y, GR_S);
        }
        if (opt === 'soldier') {
          if (inP && di <= 5) {
            var gd2 = grassDir(x, y), along = gd2.axis === 'h' ? wx : wy, brick = Math.floor(along / 4), joint = along % 4 === 0;
            var c2 = di === 1 ? [92, 52, 44] : di === 5 ? MORT : joint ? MORT : (hash(brick, gd2.axis === 'h' ? wy >> 4 : wx >> 4, 9) < .5 ? BR_D : BR_D2);
            if (di === 2 && !joint) c2 = mul(c2, 1.12);
            set(x, y, c2);
          } else if (!inP && dO === 1 && isLawn(x, y)) set(x, y, GR_S);
        }
        if (opt === 'grass' || opt === 'mix') {
          var reach = opt === 'mix' ? vnoise(wx, wy, 3, 1) * 2 + vnoise(wx, wy, 9, 2) * 2 - .6 : vnoise(wx, wy, 3, 1) * 2.4 + vnoise(wx, wy, 9, 2) * 1.6;
          if (inP && di <= reach) set(x, y, hash(wx, wy, 5) < .12 ? GR_D : lawn(x, y));
          else if (inP && di <= reach + 1) set(x, y, GR_D);
          else if (inP && di <= reach + 2 && opt === 'grass') set(x, y, mul(get(x, y), .82));
        }
      }
      g.putImageData(id, 0, 0);
    }

    return finishProps(g, scene, W, H);
  }
  var finalCv = null;
  function finalGround() {
    if (finalCv) return finalCv;
    var cv = document.createElement('canvas'); cv.width = map.w * T; cv.height = map.h * T;
    var g = cv.getContext('2d', { willReadFrequently: true });
    function all(l) { for (var i = 0; i < l.data.length; i++) { var t = tileOf(l.data[i]); if (t && !t.prop) g.drawImage(t.im, t.sx, t.sy, T, T, (i % map.w) * T, Math.floor(i / map.w) * T, T, T); } }
    all(ground); var lawn = g.getImageData(0, 0, cv.width, cv.height); all(floor);
    CC.groundFx.apply(g, lawn, map);
    return (finalCv = cv);
  }
  function finishProps(g, scene, W, H) {
    // walls and props on top, sorted by their feet
    var list = [];
    for (var ty = 0; ty < scene.h; ty++) for (var tx = 0; tx < scene.w; tx++) {
      var t = tileOf(walls.data[(scene.y + ty) * map.w + scene.x + tx]);
      if (t) list.push({ y: (ty + 1) * T, draw: (function (t, tx, ty) { return function () { g.drawImage(t.im, t.sx, t.sy, T, T, tx * T, ty * T, T, T); }; })(t, tx, ty) });
    }
    objects.forEach(function (o) {
      var t = tileOf(o.gid); if (!t) return;
      var x = o.x - scene.x * T, y = o.y - scene.y * T;
      if (x + t.w < 0 || x > W || y < 0 || y - t.h > H) return;
      list.push({ y: t.flat ? -1 : y, draw: function () { g.drawImage(t.im, Math.round(x), Math.round(y - t.h)); } });
    });
    list.sort(function (a, b) { return a.y - b.y; }).forEach(function (d) { d.draw(); });
    return g.canvas;
  }

  /* ---------- page ---------- */
  var state = { opt: 'now', scene: 'c1' };
  try { var s = JSON.parse(localStorage.getItem('edge-options') || '{}'); if (s.opt) state.opt = s.opt; if (s.scene) state.scene = s.scene; } catch (e) {}
  var cache = {};
  function get(scene, opt) { var k = scene.id + ':' + opt; return cache[k] || (cache[k] = render(scene, opt)); }
  function sceneById(id) { return SCENES.filter(function (s) { return s.id === id; })[0]; }
  function paint() {
    var sc = sceneById(state.scene), o = OPTS.filter(function (o) { return o.id === state.opt; })[0];
    var big = document.getElementById('big'), src = get(sc, state.opt);
    big.width = src.width * 3; big.height = src.height * 3;
    var bg = big.getContext('2d'); bg.imageSmoothingEnabled = false; bg.drawImage(src, 0, 0, big.width, big.height);
    document.getElementById('desc').innerHTML = '<h2>' + o.title + '</h2><p>' + o.text + '</p>';
    document.querySelectorAll('#opts button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.id === state.opt); });
    document.querySelectorAll('#scenes button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.id === state.scene); });
    var grid = document.getElementById('grid'); grid.innerHTML = '';
    OPTS.forEach(function (op, i) {
      var f = document.createElement('figure'); if (op.id === state.opt) f.className = 'on';
      var c = document.createElement('canvas'), s2 = get(sc, op.id); c.width = s2.width; c.height = s2.height; c.getContext('2d').drawImage(s2, 0, 0);
      f.appendChild(c); var cap = document.createElement('figcaption'); cap.innerHTML = '<b>' + i + '</b> · ' + op.label; f.appendChild(cap);
      f.onclick = function () { pick(op.id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      grid.appendChild(f);
    });
    try { localStorage.setItem('edge-options', JSON.stringify(state)); } catch (e) {}
  }
  function pick(id) { state.opt = id; paint(); }
  var ob = document.getElementById('opts');
  OPTS.forEach(function (o, i) { var b = document.createElement('button'); b.dataset.id = o.id; b.innerHTML = '<kbd>' + i + '</kbd>' + o.label; b.onclick = function () { pick(o.id); }; ob.appendChild(b); });
  var sb = document.getElementById('scenes');
  SCENES.forEach(function (s) { var b = document.createElement('button'); b.dataset.id = s.id; b.textContent = s.label; b.onclick = function () { state.scene = s.id; paint(); }; sb.appendChild(b); });
  document.addEventListener('keydown', function (e) { var n = +e.key; if (e.key >= '0' && e.key <= '6') pick(OPTS[n].id); });
  var all = Object.keys(imgs).map(function (k) { var im = imgs[k]; return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; }); });
  Promise.all(all).then(paint);
})();
</script>
</body>
</html>
