<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Stylised bird's-eye view of central Hanoi for the home compass background. Street palette version for the landing page.
       Not to scale: West Lake (top left), the Red River (right), Hoàn Kiếm Lake (centre right),
       the Old Quarter street grid and the Temple of Literature block (left). Original artwork. -->
  <defs>
    <pattern id="trees" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="8" r="4.5" fill="#1e7356"/><circle cx="20" cy="19" r="5" fill="#1a6a4f"/>
    </pattern>
    <pattern id="fields" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="60" height="60" fill="#0f5640"/><path d="M0 30h60M30 0v60" stroke="#0d4d36" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0d4d36"/>

  <!-- fields beyond the river -->
  <path d="M1360 0H1600V1000H1440C1420 820 1470 620 1430 430 1400 280 1330 150 1360 0Z" fill="url(#fields)"/>

  <!-- Red River -->
  <path d="M1180 0C1250 120 1300 230 1290 380 1280 540 1330 700 1300 860 1290 920 1300 960 1310 1000H1440C1420 820 1470 620 1430 430 1400 280 1330 150 1360 0Z"
        fill="#f2f3f1"/>
  <path d="M1235 0C1300 140 1340 250 1335 390 1330 560 1380 720 1355 1000" fill="none" stroke="#d9dbd6" stroke-width="3" stroke-dasharray="14 18"/>
  <!-- Long Biên bridge -->
  <path d="M1255 300L1460 330" stroke="#2b8063" stroke-width="7"/>
  <path d="M1255 300L1460 330" stroke="#0d4d36" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- West Lake -->
  <path d="M120 60C260 10 470 40 560 120 640 190 610 300 520 340 430 380 300 360 200 320 100 280 30 200 60 130 72 100 90 75 120 60Z" fill="#f2f3f1"/>
  <path d="M590 250C640 270 660 300 650 330 640 350 610 345 600 320Z" fill="#f2f3f1"/>
  <circle cx="470" cy="190" r="10" fill="#15634a"/>

  <!-- parks and trees -->
  <path d="M640 380H860V520H640Z" fill="url(#trees)"/>
  <path d="M80 600C180 560 280 600 300 680 320 760 230 820 140 800 60 780 40 660 80 600Z" fill="url(#trees)"/>
  <path d="M960 760H1180V920H960Z" fill="url(#trees)"/>

  <!-- main roads -->
  <g fill="none" stroke="#2b8063" stroke-width="12" stroke-linecap="round">
    <path d="M0 450C300 430 600 470 900 440S1200 420 1290 430"/>
    <path d="M600 0C620 200 600 400 640 600S700 900 690 1000"/>
    <path d="M0 860C300 830 700 880 1000 840S1250 820 1300 830"/>
    <path d="M300 1000C340 800 380 600 420 450"/>
    <path d="M900 0C930 150 960 300 1000 440"/>
  </g>
  <g fill="none" stroke="#0d4d36" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12">
    <path d="M0 450C300 430 600 470 900 440S1200 420 1290 430"/>
    <path d="M600 0C620 200 600 400 640 600S700 900 690 1000"/>
  </g>

  <!-- railway -->
  <path d="M870 0C860 250 880 500 860 1000" fill="none" stroke="#2b8063" stroke-width="3"/>
  <path d="M870 0C860 250 880 500 860 1000" fill="none" stroke="#2b8063" stroke-width="9" stroke-dasharray="2 14"/>

  <!-- Old Quarter grid (rotated blocks) -->
  <g transform="translate(1000 140) rotate(-8)" fill="#15634a" stroke="#0d4d36" stroke-width="2">
    <rect x="0" y="0" width="58" height="40" rx="3"/><rect x="66" y="0" width="44" height="40" rx="3"/><rect x="118" y="0" width="62" height="40" rx="3"/>
    <rect x="0" y="48" width="40" height="46" rx="3"/><rect x="48" y="48" width="70" height="46" rx="3"/><rect x="126" y="48" width="54" height="46" rx="3"/>
    <rect x="0" y="102" width="66" height="38" rx="3"/><rect x="74" y="102" width="50" height="38" rx="3"/><rect x="132" y="102" width="48" height="38" rx="3"/>
    <rect x="0" y="148" width="46" height="44" rx="3"/><rect x="54" y="148" width="58" height="44" rx="3"/><rect x="120" y="148" width="60" height="44" rx="3"/>
  </g>

  <!-- Hoàn Kiếm Lake with Turtle Tower and The Huc bridge -->
  <path d="M1080 470C1110 440 1160 450 1170 500 1180 560 1170 640 1130 670 1095 695 1060 660 1058 600 1056 540 1060 495 1080 470Z" fill="#f2f3f1"/>
  <rect x="1112" y="575" width="10" height="12" fill="#15634a"/>
  <path d="M1094 472C1080 455 1070 448 1060 440" stroke="#f4c400" stroke-width="4" fill="none"/>

  <!-- Temple of Literature block -->
  <g transform="translate(420 600)">
    <rect width="150" height="230" fill="#15634a" stroke="#0d4d36" stroke-width="2"/>
    <path d="M0 46H150M0 92H150M0 138H150M0 184H150" stroke="#0d4d36" stroke-width="2"/>
    <rect x="45" y="100" width="60" height="30" fill="#f2f3f1"/>
    <path d="M10 10h130v26H10z" fill="url(#trees)"/>
  </g>

  <!-- city blocks scattered -->
  <g fill="#15634a">
    <rect x="700" y="560" width="120" height="70" rx="4"/><rect x="720" y="660" width="90" height="120" rx="4"/>
    <rect x="160" y="420" width="110" height="80" rx="4"/><rect x="290" y="380" width="80" height="120" rx="4"/>
    <rect x="980" y="560" width="60" height="180" rx="4"/><rect x="1190" y="700" width="70" height="90" rx="4"/>
    <rect x="700" y="160" width="130" height="90" rx="4"/><rect x="720" y="270" width="100" height="80" rx="4"/>
    <rect x="40" y="900" width="200" height="70" rx="4"/><rect x="520" y="900" width="140" height="70" rx="4"/>
  </g>

</svg>
