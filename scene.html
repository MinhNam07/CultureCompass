<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore — CultureCompass</title>
  <meta name="robots" content="noindex">
  <!-- The practice scenes now live in the Explore game (explore.html). Old links like scene.html?id=sc03
       are sent to the place that plays that scene. -->
  <script src="assets/data/explore.js"></script>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('id');
      var zones = (window.CC && window.CC.exploreZones) || [];
      var z = zones.filter(function (x) { return (x.scenes || [x.sceneId]).indexOf(id) !== -1; })[0];
      location.replace('explore.html' + (z ? '?zone=' + encodeURIComponent(z.id) : ''));
    })();
  </script>
  <link rel="icon" href="assets/img/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
</head>
<body>
  <p><a href="explore.html">Practice scenes are now part of Explore. Continue to Explore</a>.</p>
</body>
</html>
